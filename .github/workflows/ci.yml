name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev)
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ benchmarks/ tests/
      # `characterization` gates compare committed numeric baselines at
      # machine-level tolerances (rtol=1e-12; same-machine/same-venv by
      # design) and are documented as local gates, not portable software
      # tests. They stay in the local default run and are excluded here.
      - name: Test (unit + integration; pybop-gated + characterization gates excluded)
        run: >-
          python -m pytest -q -m "not benchmark and not characterization"
          --junitxml="$RUNNER_TEMP/junit.xml"
      - name: Surface pytest failures as check annotations
        if: failure()
        run: |
          python - "$RUNNER_TEMP/junit.xml" <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          if not os.path.exists(path):
              sys.exit(0)
          for case in ET.parse(path).iter("testcase"):
              for problem in case.findall("failure") + case.findall("error"):
                  message = (problem.get("message") or "failed").splitlines()[0][:250]
                  fname = case.get("file")
                  location = (
                      f" file={fname},line={case.get('line') or 1}" if fname else ""
                  )
                  print(
                      f"::error{location}"
                      f"::{case.get('classname')}::{case.get('name')}: {message}"
                  )
          PY

  ecosystem:
    # pybop/pints/SALib stack is verified on CPython 3.12
    # (requirements/ecosystem-py312.lock); runs the pybop-gated tests too.
    name: test (ecosystem py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (ecosystem stack)
        run: python -m pip install -U pip && python -m pip install -e ".[dev,ecosystem]"
      # Characterization gates are excluded here as well: their baselines are
      # pinned to the frozen lock (requirements/ecosystem-py312.lock), not to
      # this floating resolution.
      - name: Test (pybop-gated included; characterization gates excluded)
        run: >-
          python -m pytest -q -m "not benchmark and not characterization"
          --junitxml="$RUNNER_TEMP/junit.xml"
      - name: Surface pytest failures as check annotations
        if: failure()
        run: |
          python - "$RUNNER_TEMP/junit.xml" <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          if not os.path.exists(path):
              sys.exit(0)
          for case in ET.parse(path).iter("testcase"):
              for problem in case.findall("failure") + case.findall("error"):
                  message = (problem.get("message") or "failed").splitlines()[0][:250]
                  fname = case.get("file")
                  location = (
                      f" file={fname},line={case.get('line') or 1}" if fname else ""
                  )
                  print(
                      f"::error{location}"
                      f"::{case.get('classname')}::{case.get('name')}: {message}"
                  )
          PY

  package:
    # Build sdist + wheel, install the wheel in a clean venv, smoke-test the
    # `parallm` entry point — the PyPI-readiness gate (publish itself stays an
    # owner action: credentials + version decision).
    name: build + wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install -U pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install wheel in a clean venv and smoke-test
        run: |
          python -m venv "$RUNNER_TEMP/wheeltest"
          "$RUNNER_TEMP/wheeltest/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/wheeltest/bin/parallm" --help
          "$RUNNER_TEMP/wheeltest/bin/python" -c "import pybamm_closed_loop; print(pybamm_closed_loop.__version__)"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
