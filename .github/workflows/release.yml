name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true
        default: v0.1.0-beta.1

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-attach:
    name: build and attach distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install -U pip build packaging
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          python - "$RELEASE_TAG" <<'PY'
          import sys
          import tomllib

          from packaging.version import Version

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = sys.argv[1].removeprefix("v")

          if Version(tag) != Version(version):
              raise SystemExit(f"tag {tag!r} does not match version {version!r}")
          PY
      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          generate_release_notes: true
          prerelease: true
          files: dist/*
